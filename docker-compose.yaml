version: '3'
services:
  minio:
    image: minio/minio
    command: server --console-address ":9001" /data
    expose:
      - 9000
      - 9001
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
  static-server:
    build: .
    ports:
      - '5000:80'
    environment:
      ACCESS_KEY: minio
      SECRET_KEY: minio123
      S3_HOST: minio:9000
      BUCKET_NAME: static
      TRANSFER_SIGNING_KEY: dev-only-signing-key-please-change-me-32
      TRANSFER_ADMIN_TOKEN: dev-only-admin-token
      TRANSFER_BUCKET_NAME: transfers
      TRANSFER_PUBLIC_BASE_URL: http://localhost:5000

